# Typechecks the website, the app and the shared package, runs the shared
# package's unit tests and lints the app, on every push and pull request.
# Free for a public repository.
name: Checks
on:
  push:
    branches: [main, expo-app]
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspace packages/shared
      - run: npm run test --workspace packages/shared
      - run: npm run typecheck --workspace apps/mobile
      - run: npx eslint . --max-warnings 50
        working-directory: apps/mobile
      # The website's route types (PageProps and friends) are generated by
      # Next.js, not committed, so make them before type-checking it.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run lint --workspace apps/web
